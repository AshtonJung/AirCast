name: AirCast
options:
  bundleIdPrefix: com.aircast.cac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  AirCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AirCast
    resources:
      - path: AirCast/Resources
    info:
      path: AirCast/Info.plist
      properties:
        CFBundleDisplayName: AirCast
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "AirCast uses your location to show local PM2.5 forecasts. You can also use Demo Mode without sharing your location."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aircast.cac.AirCast
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AirCastTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AirCastTests
    dependencies:
      - target: AirCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aircast.cac.AirCastTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AirCast:
    build:
      targets:
        AirCast: all
        AirCastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AirCastTests
    archive:
      config: Release
